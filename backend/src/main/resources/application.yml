server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/wktime
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: "wktime-jwt-secret-please-change-this-in-production-1234567890"
    expiry-minutes: 720
  mail:
    enabled: false
    from: "noreply@wktime.local"

  # Example SMTP setup:
  # mail:
  #   enabled: true
  #   from: "your-email@gmail.com"
